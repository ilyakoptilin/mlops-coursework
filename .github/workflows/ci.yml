name: MLOps CI Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint, Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff linter
        run: uv run ruff check src tests

      - name: Run Pytest with coverage threshold
        run: |
          uv run pytest -v \
            --junitxml=pytest-report.xml \
            --cov=mlops_coursework \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            pytest-report.xml
            coverage.xml

  docker-build-and-smoke:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image tagged with commit SHA
        run: docker build -t ai4i-maintenance-api:${{ github.sha }} .

      - name: Start container and run smoke checks
        run: |
          docker run -d --name smoke-api -p 8000:8000 ai4i-maintenance-api:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"machine_type":"M","air_temp_k":298.1,"process_temp_k":308.6,"rotational_speed_rpm":1551,"torque_nm":42.8,"tool_wear_min":10}'

      - name: Cleanup temporary container
        if: always()
        run: docker rm -f smoke-api || true
