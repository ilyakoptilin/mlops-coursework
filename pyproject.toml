[project]
name = "mlops-coursework"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ilyakoptilin", email = "koptilinilya@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.162.5",
    "mlflow>=3.18.0",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mlops-coursework = "mlops_coursework:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
